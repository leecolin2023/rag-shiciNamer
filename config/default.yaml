# ============================================================================
# shici-namer 口径配置
# ----------------------------------------------------------------------------
# 这个文件是**唯一的口径来源**。改这里等于改结论，改完必须跑 `python -m unittest`
# 确认 tests/ 里的一致性断言仍然通过。
#
# 每一项都写了「为什么是这个值」。不要在没有记录理由的情况下改数字。
# ============================================================================

version: 1

# ---------------------------------------------------------------------------
# 数据路径
# 相对路径以项目根目录为基准。可用环境变量 SHICI_DATA_ROOT 覆盖 corpus.root。
# ---------------------------------------------------------------------------
paths:
  # 语料根目录。默认自包含：data/upstream/ 由 `python data/fetch.py --link-to ...` 或
  # `--download` 收集（结构要求见 data/README.md）。换数据盘可设 SHICI_DATA_ROOT。
  corpus_root: "data/upstream"
  # 平水韵韵书（LingDong-/cope 的 data/rhymebooks.json）
  rhyme: "data/upstream/rhymebooks.json"
  # 康熙字典数据（提供部首字段），来自 bename 仓库（注意其默认分支是 master）
  radical: "data/upstream/kangxi.json"
  # 停用字表（相对项目根）
  stopwords: "config/stopwords.txt"
  # 名篇目录（唐诗三百首/宋词三百首/楚辞核心篇目），出处分级用，见 rank.use_famous
  famous: "config/famous_sources.txt"
  # 地名志（行政区词干，data/build_place_names.py 生成），D-011 地名碎片标记用
  place_names: "config/place_names.txt"

# ---------------------------------------------------------------------------
# 语料
# book_rank 同时用于两件事：① 出处优先展示顺序 ② 跨书计数的范围
# 顺序按「经典程度」排：先秦经典 > 唐诗 > 宋词 > 宋诗
# ---------------------------------------------------------------------------
corpus:
  books: ["诗经", "楚辞", "论语", "周易", "唐诗", "宋词", "宋诗"]
  book_rank:
    诗经: 0
    楚辞: 1
    论语: 2
    周易: 3
    唐诗: 4
    宋词: 5
    宋诗: 6
  # 每句切分符。逗号也必须切，因为 2-gram 只需要相邻两字，不需要整句
  split_pattern: "[！。？；!?\\n\\r，、：,]+"

# ---------------------------------------------------------------------------
# 摘词（extract）
# ---------------------------------------------------------------------------
extract:
  # 词长。当前只支持 2（单字名另有处理路径，见 docs/SPEC.md §5）
  length: 2
  # 成词证据，双通道取或（见 docs/DECISIONS.md D-007）：
  #   ① 该词在「真实姓名库」中出现 ≥ min_population_freq 次（有人叫过）
  #   ② 该词在本语料中出现 ≥ min_corpus_freq 次（反复出现，非偶然相邻）
  # min_population_freq：用户偏好（2026-10）设为 2——「全库至少 2 人叫过」，
  # 挡掉单源孤证词（锡爵/武发这类典礼叙事片段大多 pop=1），榜单头部更干净。
  # 代价：徽音（人口 1）这类「罕见而美」的名字被挡在门外；想要它们时改回 1。
  # 历史值：3（初版，杀死徽音）→ 1（D-007，验收"好名靠前"）→ 2（当前浏览偏好）。
  min_population_freq: 2
  # 0 = 关闭通道②。>1 时启用（呦呦：人口 0，但《鹿鸣》出现 3 次，只能靠它）。
  min_corpus_freq: 2
  # 通道②的适用范围（D-007）："叠字" / "全部" / "关"。
  # 限定叠字的理由：叠音（呦呦/灼灼/依依）是《诗经》的构词法，「两个字
  # 叠起来」本身就是强成词证据；而任意 2-gram 出现 ≥2 次多是诗法套语
  # （实测：言告/顷筐/兔罝/叶萋 全部 corpus=2、人口=0，没有一个是名字）。
  # 全部开放会放进数百个这类语法碎片。
  corpus_channel: "叠字"
  # 每个候选最多保留几条出处（用于导出，不影响统计）
  max_sources: 3

# ---------------------------------------------------------------------------
# 筛选（filter）
# ---------------------------------------------------------------------------
filter:
  # 停用字：含这些字的 2-gram 直接丢弃。
  # 理由：纯 2-gram 必然产生「其道」「国之」「以成」这类语法组合，
  # 且它们在真实姓名库里确实存在（有人叫过），词表校验拦不住。
  use_stopwords: true
  # 同部首剔除（默认开）：杀掉「桢柏」「楷桐」这类同义堆叠。
  # 关掉会多出约 900 个候选，但会出现大量「两个木本植物」式名字。
  drop_same_radical: true
  # 性别倾向阈值：真实姓名库中该性别占比 >= 此值才算「匹配」。
  # 0.75 是经验值。记录里性别字段全为「未知」时记为「未知」，不参与筛选。
  gender_ratio: 0.75
  # 地名碎片的语境证据（D-011）：若 2-gram 的**全部**非句末右邻都属于此表
  # （且 ≥2 次）→ 它是更长地名的词干（「武强」右邻永远是「縣」），标 place_flag 垫后。
  # 严格全称判定是关键：「乔木」31 种右邻里 1 个「都」不算证据（首版任一命中
  # 曾把 乔木/功名/黄金 误伤到 #15000+）。只判右邻不判左邻——「都」在左邻
  # 是常见副词，会大面积误伤。
  place_context_chars: "县縣郡州府都邑镇京"

# ---------------------------------------------------------------------------
# 音韵（phonology）
# ---------------------------------------------------------------------------
phonology:
  # 平仄依据：平水韵（含入声）| 中华新韵（近普通话）| 广韵
  # 平水韵是本项目的核心选择：它让「王安石」判为「平平仄」（石为入声），
  # 而普通话四声会误判为「平平平」。
  rhyme_book: "平水韵"
  # 两读字（在平声组和仄声组同时出现，222 个）标为「通」，不作为平仄交错的有效依据。
  # 用单字标签是为了让 pingze 字符串与名字逐位对齐（len 相等）。
  ambiguous_label: "通"
  # 硬性排除？双声（参差/清泉）、叠韵（窈窕）在汉语里是修辞美，**不应排除**。
  # 这里只保留开关位；默认 false = 只标记不排除。
  drop_same_initial: false
  drop_same_final: false

# ---------------------------------------------------------------------------
# 排序（rank）
# ---------------------------------------------------------------------------
rank:
  # 数字字表：名字任一字在此表内 → has_numeral=true。
  # 理由（D-007）：语料高频 2-gram 中数词短语最多（四方/百年/一生/万邦/九天），
  # 作为人名普遍平庸，默认排序垫后（只降权、不剔除）。
  numeral_chars: "一二三四五六七八九十百千万亿零两"
  # 出处分级开关：任一出处命中 config/famous_sources.txt（唐诗三百首/
  # 宋词三百首/楚辞核心篇目）→ source_famous=true，排序时名篇出的词优先。
  # 依据（D-007）：频次类信号（语料词频/人口频次）在极端处与好名负相关，
  # 选本收录是可引用、可核对的经典度证据（蘅塘退士/朱祖谋/王逸章句）。
  use_famous: true
  # 排序键，按顺序比较。支持 key:asc / key:desc 后缀覆盖默认方向
  # （频次类默认降序，标记/经典度类默认升序，详见 rank.py）。
  # 可用字段：
  #   has_numeral         含数字字（bool，false 优先）
  #   place_flag          地名碎片（bool，false 优先；D-011）
  #   source_fame         出自名篇（bool，true 优先）
  #   best_book_rank      最佳出处经典度（int 升序：诗经0 < 楚辞1 < 论语2 < …）
  #   pingze_interleave   平仄交错（bool，true 优先）
  #   same_initial        同声母（bool，false 优先）
  #   same_final          同韵母（bool，false 优先）
  #   dual_rarity         双界稀有度 = min(语料词频, 人口频次)（升序）
  #   tone_variety        全名声调去重数（int 降序：3>2>1，无姓时中性=3）
  #   junction_liasion    姓鼻音韵尾+名首零声母（bool，false 优先）
  #   tail_open           尾字洪音收尾（bool，true 优先）
  #   corpus_freq         语料词频（int）
  #   population_freq     真实人口频次（int）
  #   book_count          出处跨书数（int）
  # place_flag 放在名篇之前（D-011）：地名碎片即使出自经典也不是好名字。
  # 降权不剔除——「观清都」的 观清 是动词+地名跨界词，硬剔会误伤。
  # 默认序的设计依据见 D-007/D-008/D-009/D-010/D-011：
  #   数词垫后 → 名篇优先 → 名篇层内双界稀有 → 全名声调多样性
  #   → 连读吞音垫后 → 人口独特性（升序）→ 语料独特性（升序）→ 尾字洪细。
  # 听感键的取舍（D-009，按你对各维度的偏好可直接调换顺序）：
  #   - tone_variety 只降权不剔除：王维(2-2)/徽音(1-1) 是同调好名；
  #     三连同调（聂趯趯 4-4-4）确实最单调，放在 dual 之后先把它们压下去。
  #   - tail_open：用户偏好（2026-10）「要更响亮的收尾」→ 提到频次键之前，
  #     成为实际的分层键（洪音收尾优先）。代价：细音收尾的好名（心 X/金 X
  #     类 in/ing 尾）会被压后；想要柔和收尾时把它挪回最末。
  # dual_rarity 只放在名篇层内使用：层外的全量语料上它会失真
  # （「一生」min=5 压过「清扬」min=7）。名篇层内不能用人口降序
  # （模拟实测「志刚/国成/大宝」会还魂，D-005 教训）。
  # same_final 在 dual_rarity 之前：用户偏好（2026-10）「压掉叠字层」——
  # 叠字必然同韵母，此键把 pop=0 叠字区（绳绳/晏晏/呦呦）整体压到层后。
  # 代价一：呦呦 从榜首跌到叠字层内部；代价二：D-004 说的非叠字叠韵美词
  # （窈窕/逍遥类）也被一并压后。想看叠字层时删掉这一行。
  # 说明：**不设综合加权分**（D-003）。用户应按任一维自行重排（全字段保留）。
  order:
    - has_numeral
    - place_flag
    - source_fame
    - same_final
    - dual_rarity
    - tone_variety
    - junction_liasion
    - tail_open
    - population_freq:asc
    - corpus_freq:asc

# ---------------------------------------------------------------------------
# 导出
# ---------------------------------------------------------------------------
export:
  csv_encoding: "utf-8-sig"
  # CSV 列顺序（改这里要同步改 export.py 的写出行，tests 会检查一致性）
  columns:
    - 姓名
    - 名
    - 平仄
    - 今调
    - 全名声调
    - 声母
    - 韵母
    - 部首
    - 同部首
    - 性别倾向
    - 男女比
    - 语料词频
    - 真实人口频次
    - 出处跨书数
    - 首选出处
    - 首选原句
    - 全部出处
    - 尾字洪细
